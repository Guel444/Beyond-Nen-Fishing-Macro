name: Build Windows executable

on:
  push:
    branches: [main]
    paths:
      - "beyond_nen_app.py"
      - "requirements.txt"
      - "BeyondNenFishing.spec"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm BeyondNenFishing.spec

      - name: Verify build output and create ZIP
        shell: pwsh
        run: |
          $exe = "dist/BeyondNenFishing.exe"
          if (!(Test-Path $exe)) {
            throw "PyInstaller did not create $exe"
          }
          if ((Get-Item $exe).Length -lt 1MB) {
            throw "The executable is unexpectedly small; refusing to package it."
          }
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path "dist/BeyondNenFishing.exe", "dist/LEIA-ME.txt" -DestinationPath "dist/Beyond-Nen-Fishing-Windows.zip" -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Nen-Fishing-Windows
          path: dist/Beyond-Nen-Fishing-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: BeyondNenFishing-exe
          path: dist/BeyondNenFishing.exe
          if-no-files-found: error
          retention-days: 14
